spring.application.name=docquery

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:docquery}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- OpenAI ----------
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ---------- App ----------
app.chunk.size-words=350
app.chunk.overlap-words=60
app.retrieval.top-k=4
server.port=${SERVER_PORT:8080}
